# Alert rules as code (NFR-O4). Every alert links to a docs/RUNBOOK.md section.
# Thresholds are placeholders until the first k6 baseline (spec §4.3: no targets before measuring).
groups:
  - name: webhook-platform
    rules:
      - alert: OutboxBacklogGrowing
        expr: max(webhook_outbox_backlog) > 1000 and deriv(max(webhook_outbox_backlog)[10m:1m]) > 0
        for: 10m
        labels: { severity: page }
        annotations:
          summary: Outbox backlog is growing — relay down or Kafka unreachable
          runbook: docs/RUNBOOK.md#2-outbox-backlog-growing

      - alert: ConsumerLagGrowing
        expr: sum by (group, topic) (webhook_kafka_consumer_lag) > 1000 and sum by (group, topic) (deriv(webhook_kafka_consumer_lag[10m])) > 0
        for: 10m
        labels: { severity: page }
        annotations:
          summary: "Consumer lag growing for {{ $labels.group }} on {{ $labels.topic }}"
          runbook: docs/RUNBOOK.md#3-consumer-lag-growing

      - alert: DeadMessages
        expr: increase(webhook_messages_dead_total[15m]) > 0
        labels: { severity: ticket }
        annotations:
          summary: Messages exhausted every retry tier and went to the DLQ
          runbook: docs/RUNBOOK.md#4-dlq-non-empty

      - alert: DeliverySuccessRateLow
        expr: |
          sum(rate(webhook_delivery_attempts_total{result="success"}[10m]))
            / sum(rate(webhook_delivery_attempts_total[10m])) < 0.5
        for: 15m
        labels: { severity: ticket }
        annotations:
          summary: Less than half of delivery attempts succeed
          runbook: docs/RUNBOOK.md#5-delivery-success-rate-low

      - alert: APIHighErrorRate
        expr: |
          sum(rate(http_requests_total{service="api",status=~"5.."}[5m]))
            / sum(rate(http_requests_total{service="api"}[5m])) > 0.01
        for: 5m
        labels: { severity: page }
        annotations:
          summary: API 5xx ratio above 1%
          runbook: docs/RUNBOOK.md#1-api-5xx-rate
