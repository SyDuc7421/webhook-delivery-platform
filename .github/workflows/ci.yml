name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GOLANGCI_VERSION: "v2.5.0"

jobs:
  # Path filters (ADR-0006): a web-only change does not run the Go jobs, and the reverse.
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      web: ${{ steps.filter.outputs.web }}
      infra: ${{ steps.filter.outputs.infra }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'deploy/**'
              - '.github/workflows/ci.yml'
            web:
              - 'web/**'
            infra:
              - 'infra/**'

  commitlint:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm }
      - run: npm ci
      - run: npx commitlint --from=${{ github.event.pull_request.base.sha }} --to=${{ github.sha }} --verbose

  lint:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: backend/go.mod, cache-dependency-path: backend/go.sum }
      - uses: golangci/golangci-lint-action@v8
        with: { version: "${{ env.GOLANGCI_VERSION }}", working-directory: backend, args: --timeout=5m }
      - name: go mod tidy is clean
        run: go mod tidy && git diff --exit-code go.mod go.sum

  test:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: backend/go.mod, cache-dependency-path: backend/go.sum }
      - run: go test -race -shuffle=on -covermode=atomic -coverprofile=coverage.out ./...
      - name: coverage gate
        run: |
          total=$(go tool cover -func=coverage.out | tail -1 | awk '{print substr($3, 1, length($3)-1)}')
          echo "total coverage: $total%"
          awk -v t="$total" 'BEGIN{ if (t+0 < 60) { print "coverage below 60%"; exit 1 } }'
      - uses: actions/upload-artifact@v4
        with: { name: coverage, path: backend/coverage.out }

  # testcontainers starts Postgres, Kafka and Redis itself (Docker is available on ubuntu runners).
  integration:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: backend/go.mod, cache-dependency-path: backend/go.sum }
      - run: go test -race -count=1 -tags=integration ./test/...

  security:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-go@v5
        with: { go-version-file: backend/go.mod, cache-dependency-path: backend/go.sum }
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest && govulncheck ./...
        working-directory: backend
      - uses: gitleaks/gitleaks-action@v3
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }

  build:
    needs: [lint, test]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [api, relay, dispatcher, delivery-worker, retry-worker]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: backend
          target: runtime
          build-args: APP=${{ matrix.app }}
          push: false
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
          tags: "webhook-platform-${{ matrix.app }}:${{ github.sha }}"
          load: true
      - uses: aquasecurity/trivy-action@0.29.0
        with:
          image-ref: "webhook-platform-${{ matrix.app }}:${{ github.sha }}"
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

  # Added in later milestones (see docs/deploy.md §3):
  #   web   (needs.changes.outputs.web)   — typecheck, lint, Vitest, build       (M4)
  #   e2e   — Playwright against deploy/docker-compose.yml                       (M5)
  #   infra (needs.changes.outputs.infra) — terraform fmt -check, validate, tflint (M6)
  #   push to ECR via OIDC on main; manual deploy / destroy workflows             (M6)
