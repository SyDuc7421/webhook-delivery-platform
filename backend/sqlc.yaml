version: "2"
sql:
  - engine: postgresql
    schema: migrations
    queries: internal/repository/postgres/queries
    gen:
      go:
        package: db
        out: internal/repository/postgres/db
        sql_package: pgx/v5
        emit_interface: true
        emit_json_tags: false
        emit_pointers_for_null_types: true
        emit_empty_slices: true
        overrides:
          - db_type: timestamptz
            go_type: time.Time
          - db_type: uuid
            go_type:
              import: github.com/google/uuid
              type: UUID
