openapi: 3.1.0
info:
  title: webhook-platform API
  version: 0.1.0
  description: |
    Hand-written contract (docs/API.md §Documentation). Every error uses the `Error` envelope.
    Dashboard routes take a JWT access token; ingest (M1c) takes an API key.
servers:
  - url: http://localhost:8080
tags:
  - name: auth
paths:
  /v1/auth/register:
    post:
      tags: [auth]
      summary: Register a user and create their org (FR-A1)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, password, org_name]
              properties:
                email: { type: string, format: email, maxLength: 254, description: Trimmed and lowercased }
                password: { type: string, minLength: 12, maxLength: 128 }
                org_name: { type: string, minLength: 1, maxLength: 100 }
      responses:
        "201": { $ref: "#/components/responses/Session" }
        "400": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /v1/auth/login:
    post:
      tags: [auth]
      summary: Log in (FR-A2)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [email, password]
              properties:
                email: { type: string }
                password: { type: string }
      responses:
        "200": { $ref: "#/components/responses/Session" }
        "400": { $ref: "#/components/responses/Error" }
        "401":
          description: Unknown email or wrong password (same response for both)
          content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
  /v1/auth/refresh:
    post:
      tags: [auth]
      summary: Trade a refresh token for a new session; the old token stops working
      requestBody: { $ref: "#/components/requestBodies/RefreshToken" }
      responses:
        "200": { $ref: "#/components/responses/Session" }
        "401": { $ref: "#/components/responses/Error" }
  /v1/auth/logout:
    post:
      tags: [auth]
      summary: Revoke a refresh token
      requestBody: { $ref: "#/components/requestBodies/RefreshToken" }
      responses:
        "204": { description: Logged out }
        "400": { $ref: "#/components/responses/Error" }
  /v1/me:
    get:
      tags: [auth]
      summary: The caller and their org
      security: [{ bearerJWT: [] }]
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      user: { $ref: "#/components/schemas/User" }
                      org: { $ref: "#/components/schemas/Org" }
        "401": { $ref: "#/components/responses/Error" }
components:
  securitySchemes:
    bearerJWT:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token from register/login/refresh, valid 15 minutes.
  requestBodies:
    RefreshToken:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [refresh_token]
            properties:
              refresh_token: { type: string }
  responses:
    Session:
      description: A new session
      content:
        application/json:
          schema:
            type: object
            properties:
              data:
                type: object
                properties:
                  user: { $ref: "#/components/schemas/User" }
                  org: { $ref: "#/components/schemas/Org" }
                  access_token: { type: string }
                  expires_at: { type: string, format: date-time }
                  refresh_token: { type: string, description: Single use; store securely }
    Error:
      description: Error envelope
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string }
        role: { type: string, enum: [owner, member] }
        created_at: { type: string, format: date-time }
    Org:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
    Error:
      type: object
      required: [error, request_id]
      properties:
        error:
          type: object
          required: [code, message, details]
          properties:
            code:
              type: string
              description: Stable SCREAMING_SNAKE code; clients switch on it
              examples: [VALIDATION_FAILED, UNAUTHORIZED, FORBIDDEN, RESOURCE_NOT_FOUND, ALREADY_EXISTS, UNPROCESSABLE_ENTITY, PAYLOAD_TOO_LARGE, RATE_LIMITED, UNAVAILABLE, INTERNAL]
            message: { type: string }
            details:
              type: array
              items:
                type: object
                properties:
                  field: { type: string }
                  issue: { type: string }
        request_id: { type: string }
